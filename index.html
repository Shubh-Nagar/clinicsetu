<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- %TITLE%, %DESCRIPTION%, %URL%, %BRAND% and %JSONLD% are filled in from
         src/content/site.js by the small plugin in vite.config.js -->
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <link rel="canonical" href="%URL%/" />
    <meta name="theme-color" content="#1F6B50" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / WhatsApp link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND%" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:url" content="%URL%/" />
    <meta property="og:image" content="%URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Bricolage Grotesque (display) + Atkinson Hyperlegible (body, built for legibility) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..700&display=swap"
    />

    <script type="application/ld+json">%JSONLD%</script>
  </head>
  <body class="bg-white font-sans text-ink antialiased">
    <noscript>This site needs JavaScript. You can also reach me on WhatsApp at +91 93217 32524.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
